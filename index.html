<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>football.manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background-block">
        <header class="header">
            <nav class="wrapper header-wrapper">
                <img class="logo-header" src="Img/лого.png" alt="logo">
                <ul class="ul-header">
                    <li><a href="#">Про нас</a></li>
                    <li><a href="#">Контакти</a></li>
                    <li><a href="#">Івенти</a></li>
                    <li><a href="#">Групи</a></li>
                </ul>
                <div class="contact">
                    <p class="number"><a href="tel:+380505055055">
                        <picture class="phone">
                            <source srcset type="img/phone.png">
                            <img src="Img/phone.svg" alt="#">
                        </picture>
                        +38 050 505 50 55
                    </a></p>
                </div>
            </nav>
        </header>
        <main class="main">
            <section class="info">
                <p class="text-above-head">Знайди свій рівень. Тренуйся як профі</p>
                <h1>Професійні заняття з футболу в Хмельницькому</h1>
                <p class="text-under-head">Почни свій футбольний шлях!</p>
                <div class="button">
                    <a href="#" class="btn">Записатись на заняття</a>
                </div>
                <div class="stars">
                    <img src="Img/zirochka.svg" alt="зірки">
                    <p>1.200+ задоволених учнів</p>
                </div>
            </section>
        </main>
    </div>
    <footer class="footer">
        <div class="wrapper">
            <div class="footer-elements">
                <div class="schedule">
                    <p>Пн-Пт: 8-20:00</p>
                    <p>Сб-Нд: 10-19:00</p>
                </div>
                <nav>
                    <ul class="images">
                        <li><a href="#"><img src="Img/geo-svg.svg" alt="geo"></a></li>
                        <li><a href="#"><img src="Img/inst-svg.svg" alt="inst"></a></li>
                        <li><a href="#"><img src="Img/tg-svg.svg" alt="tg"></a></li>
                    </ul>
                </nav>
                <div>
                    <div>
                        <img class="logo-footer" src="Img/лого-footer.PNG" alt="logo">
                        <p class="sinse-2025">sinse 2025</p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
