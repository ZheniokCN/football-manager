<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=yes, initial-scale=1.0, maximum-scale=2.0, minimum-scale=1.0">
    <title>football-manager page with </title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="dark-bgc"></div>
    <div class="background-block">
        <header class="header">
            <nav class="wrapper header-wrapper">
                <picture class="logo-header">
                    <a href="/"><img src="img/лого.png" alt="logo"></a>
                </picture>
                <ul class="menu">
                    <li class="item-menu"><a class="link-menu" href="#">Про нас</a></li>
                    <li class="item-menu"><a class="link-menu" href="#">Контакти</a></li>
                    <li class="item-menu"><a class="link-menu" href="#">Івенти</a></li>
                    <li class="item-menu"><a class="link-menu" href="#">Групи</a></li>
                    <li class="cancel">x</li>
                </ul>
                <div class="contact">
                    <p class="number"><a href="tel:+380505055055">
                            <picture class="phone">
                                <source srcset type="img/phone.png">
                                <img src="img/phone.svg" alt="#">
                            </picture>
                            +38 050 505 50 55
                        </a>
                    </p>
                </div>
                <picture class="burger"><img src="img/burger.svg" alt="burger"></picture>
            </nav>
        </header>
        <main class="main">
            <div class="wrapper">
                <section class="info">
                    <div class="info-bg">
                        <div class="main-bl-main">
                            <p class="text-above-head">Знайди свій рівень. Тренуйся як профі</p>
                            <h1>Професійні заняття з футболу в Хмельницькому</h1>
                            <p class="text-under-head">Почни свій футбольний шлях!</p>
                            <div class="button">
                                <a href="#" class="btn">Записатись на заняття</a>
                            </div>
                            <div class="stars">
                                <img src="img/zirochka.svg" alt="зірки">
                                <p>1.200+ задоволених учнів</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
            <div class="img-bl">
                <img src="img/ball_background.webp" alt="ball">
            </div>
        </main>
    </div>
    <footer class="footer">
        <nav class="wrapper">
            <div class="footer-elements">
                <div class="schedule">
                    <p>Пн-Пт: 8-20:00</p>
                    <p>Сб-Нд: 10-19:00</p>
                </div>
                <nav>
                    <ul class="images">
                        <li><a href="#"><img src="img/geo-svg.svg" alt="geol"></a></li>
                        <li><a href="#"><img src="img/inst-svg.svg" alt="insta"></a></li>
                        <li><a href="#"><img src="img/tg-svg.svg" alt="tg"></a></li>
                    </ul>
                </nav>
                <div>
                    <div>
                        <a href="/"><img class="logo-footer" src="img/лого-footer.png" alt="logo"></a>
                        <p class="sinse-2025">sinse 2025</p>
                    </div>
                </div>
            </div>
        </nav>
    </footer>
    <script>
        const dark = document.querySelector(".dark-bgc"),
            burger = document.querySelector(".burger"),
            menu = document.querySelector(".menu"),
            cancel = document.querySelector(".cancel")

        burger.addEventListener("click", function () {
            menu.style.left = "0";
            dark.style.display = "block"
        })

        function cancelBurger() {
            menu.style.left = "-100%";
            dark.style.display = "none"
        }
        cancel.addEventListener("click", cancelBurger)
        dark.addEventListener("click", cancelBurger)
    </script>
</body>

</html>
